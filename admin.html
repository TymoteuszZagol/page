<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SICARIO APP</title><style>
:root{color-scheme:dark;font-family:Inter,Segoe UI,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#090a10;color:#f5f4fa}nav{display:flex;justify-content:space-between;align-items:center;padding:25px max(6%,calc((100% - 1150px)/2));border-bottom:1px solid #292d3e}b{letter-spacing:2px}nav a{color:#bda4f7;text-decoration:none}main{max-width:1150px;margin:auto;padding:90px 25px}h1{font-size:clamp(48px,8vw,90px);line-height:1.02;letter-spacing:-4px;margin:10px 0 25px}h1 span{color:#9766ff}p{color:#9498ae;line-height:1.7;max-width:620px}button,.btn{display:inline-block;border:0;border-radius:11px;background:#9766ff;color:white;padding:15px 24px;font-size:15px;font-weight:700;text-decoration:none;cursor:pointer}button:hover,.btn:hover{background:#8050e9}.ghost{background:#191d2b}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-top:70px}.card{border:1px solid #292d3e;background:#121520;border-radius:18px;padding:25px}.card h3{margin-top:0}.pill{display:inline-block;color:#cbb6ff;border:1px solid #473366;border-radius:50px;padding:7px 14px;font-size:12px;letter-spacing:2px}footer{border-top:1px solid #292d3e;padding:25px;text-align:center;color:#9498ae}input,select{width:100%;background:#0d101b;border:1px solid #383247;border-radius:10px;padding:13px;color:white;margin:7px 0 16px}#admin{display:none;margin-top:65px}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #292d3e;padding:12px;font-size:13px}#output{white-space:pre-wrap;overflow-wrap:anywhere;color:#cbb6ff}small{color:#9498ae}

.lang{width:auto;margin:0;padding:9px 12px}.topright{display:flex;align-items:center;gap:12px}.muted{color:#9498ae}a{color:#bda4f7} .hidden{display:none!important}
</style></head><body><nav><b>◆ SICARIO <span style="color:#9766ff">APP</span></b><div class="topright"><a href="./" data-i18n="back"></a><select class="lang" aria-label="Language" onchange="setLang(this.value)"><option value="pl">PL</option><option value="en">EN</option></select></div></nav><main style="padding-top:55px"><h1 style="font-size:clamp(36px,6vw,62px)" data-i18n="adminTitle"></h1><p data-i18n="adminDescription"></p><section id="admin" style="display:block;margin-top:30px"><label><span data-i18n="api"></span><input id="api" value="http://127.0.0.1:8000" placeholder="https://api.example.com"></label><label><span data-i18n="token"></span><input id="token" type="password" autocomplete="off"></label><label><span data-i18n="tier"></span><select id="tier"><option>MACRO ONLY</option><option>AUTO QUEUE ONLY</option><option>FULL ACCESS</option></select></label><button onclick="createKey()" data-i18n="create"></button> <button class="ghost" onclick="listKeys()" data-i18n="refresh"></button><p id="output" role="status"></p><div style="overflow:auto"><table><thead><tr><th data-i18n="id"></th><th data-i18n="key"></th><th data-i18n="type"></th><th data-i18n="activated"></th><th data-i18n="status"></th><th data-i18n="actions"></th></tr></thead><tbody id="rows"></tbody></table></div></section></main><footer>SICARIO APP • ALL RIGHTS RESERVED</footer><script>
const translations={
pl:{description:'Personalizuj skróty, zarządzaj profilami i ustawieniami. Aplikacja na Windows z interfejsem PL/EN.',download:'POBIERZ NA WINDOWS',queue:'Pozycja kursora, interwał i skrót uruchamiania.',keybinds:'Ruch, budowanie, sloty i edycja.',profiles:'Zapisuj i wczytuj własne konfiguracje.',adminTitle:'PANEL ADMINISTRATORA',adminDescription:'Zarządzanie licencjami. Dostęp wymaga tokenu administratora.',api:'Adres API',token:'Token administratora',tier:'Typ licencji',create:'GENERUJ LICENCJĘ',refresh:'ODŚWIEŻ LISTĘ',id:'ID',key:'Klucz',type:'Typ',activated:'Aktywowana',status:'Stan',actions:'Akcje',revoke:'Cofnij',reset:'Reset PC',yes:'TAK',no:'NIE',revoked:'COFNIĘTA',active:'AKTYWNA',newKey:'Nowy klucz (skopiuj teraz): ',back:'Strona główna',confirm:'Potwierdzić operację?',error:'Błąd: '},
en:{description:'Customize shortcuts, manage profiles and settings. Windows desktop app with a PL/EN interface.',download:'DOWNLOAD FOR WINDOWS',queue:'Cursor position, interval, and start shortcut.',keybinds:'Movement, building, slots, and editing.',profiles:'Save and load your own configurations.',adminTitle:'ADMIN PANEL',adminDescription:'License management. An administrator token is required.',api:'API URL',token:'Administrator token',tier:'License type',create:'GENERATE LICENSE',refresh:'REFRESH LIST',id:'ID',key:'Key',type:'Type',activated:'Activated',status:'Status',actions:'Actions',revoke:'Revoke',reset:'Reset PC',yes:'YES',no:'NO',revoked:'REVOKED',active:'ACTIVE',newKey:'New key (copy it now): ',back:'Home',confirm:'Confirm this action?',error:'Error: '}}
function currentLang(){return localStorage.getItem('sicario_lang')==='en'?'en':'pl'}
function tr(k){return translations[currentLang()][k]||k}
function applyLang(){const l=currentLang();document.documentElement.lang=l;document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=tr(e.dataset.i18n));document.querySelectorAll('.lang').forEach(e=>e.value=l)}
function setLang(l){localStorage.setItem('sicario_lang',l);applyLang()}
document.addEventListener('DOMContentLoaded',applyLang);

const $=id=>document.getElementById(id);
async function call(path,method='GET',body){const base=$('api').value.trim().replace(/\/$/,'');const res=await fetch(base+'/api/admin/'+path,{method,headers:{'Authorization':'Bearer '+$('token').value,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await res.json();if(!res.ok)throw Error(data.detail||res.status);return data}
async function createKey(){try{const d=await call('create','POST',{tier:$('tier').value});$('output').textContent=tr('newKey')+d.key;await listKeys()}catch(e){$('output').textContent=tr('error')+e.message}}
async function listKeys(){try{const d=await call('licenses');$('rows').replaceChildren();for(const x of d.licenses){const row=document.createElement('tr');for(const v of [x.id,x.key_hint,x.tier,x.device_id?tr('yes'):tr('no'),x.revoked?tr('revoked'):tr('active')]){const td=document.createElement('td');td.textContent=v;row.append(td)}const actions=document.createElement('td');for(const [label,path] of [['revoke','revoke'],['reset','reset-device']]){const b=document.createElement('button');b.textContent=tr(label);b.className='ghost';b.style.padding='8px';b.style.margin='3px';b.onclick=async()=>{if(!confirm(tr('confirm')+' #'+x.id+'?'))return;try{await call(path,'POST',{id:x.id});await listKeys()}catch(e){$('output').textContent=tr('error')+e.message}};actions.append(b)}row.append(actions);$('rows').append(row)}}catch(e){$('output').textContent=tr('error')+e.message}}
</script></body></html>
